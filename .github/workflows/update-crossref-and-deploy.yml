# DOI Prefix Publication Dashboard - GitHub Actions Workflow
# Creator: Ikhwan Arief (ikhwan[at]unand.ac.id)

name: Update Crossref Data and Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: "0 20 * * 0"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    env:
      CROSSREF_PREFIX: "10.25077"
      CROSSREF_MAILTO: ${{ vars.CROSSREF_MAILTO }}
      CROSSREF_USER_AGENT: ${{ vars.CROSSREF_USER_AGENT }}
      CITEDBY_START_DATE: ${{ vars.CITEDBY_START_DATE }}
      CITEDBY_END_DATE: ${{ vars.CITEDBY_END_DATE }}
      CROSSREF_CITEDBY_USER: ${{ secrets.CROSSREF_CITEDBY_USER }}
      CROSSREF_CITEDBY_PASSWORD: ${{ secrets.CROSSREF_CITEDBY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch Crossref data
        run: npm run fetch:all

      - name: Build static site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
